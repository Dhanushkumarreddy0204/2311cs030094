version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: notification_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notification_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: notification_cache
    ports:
      - "6379:6379"

volumes:
  pgdata:
